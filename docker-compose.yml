name: vidagt

x-backend-env: &backend-env
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-vidagt}:${MYSQL_PASSWORD:-vidagt}@mysql:3306/${MYSQL_DATABASE:-vidagt}?charset=utf8mb4
    REDIS_URL: redis://redis:6379/3
    REDIS_SEARCH_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    MINIO_ENDPOINT: http://minio:9000
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}

x-backend-depends: &backend-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vidagt}
      MYSQL_USER: ${MYSQL_USER:-vidagt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vidagt}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-permissions:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 100:101 /data"]
    volumes:
      - minio-data:/data
    restart: "no"

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:5173,http://localhost:8080}
    volumes:
      - minio-data:/data
    depends_on:
      minio-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      target: api
    <<: *backend-env
    depends_on: *backend-depends
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/root/.cache

  worker-media:
    build:
      context: ./backend
      target: media
    <<: *backend-env
    depends_on: *backend-depends
    volumes:
      - model-cache:/root/.cache
      - worker-tmp:/tmp/vidagt

  worker-agent:
    build:
      context: ./backend
      target: api
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "-Q", "agent", "--loglevel=INFO", "--concurrency=2"]
    <<: *backend-env
    depends_on: *backend-depends

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mysql-data:
  redis-data:
  minio-data:
  model-cache:
  worker-tmp:
